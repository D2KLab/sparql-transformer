name: Install and test sparql-transformer

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v3
      - name: use node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24.x"
      - run: npm ci
      - run: npm test
